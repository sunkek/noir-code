[project]
name = "noircode"
version = "0.1.0"
description = "NoiR Code: visual data encoding as a noir comic panel (reference implementation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "reedsolo>=1.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Imaging sidecar: a thin HTTP service the Go gateway calls for encode/decode.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.9",
]

[project.scripts]
noir = "noircode.cli:app"
noir-api = "noircode.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noircode"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "reedsolo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
