[project]
name = "noircode"
version = "0.1.0"
description = "NoiR Code: visual data encoding as a noir comic panel (reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Capped below 2.5: numpy 2.5 requires Python >= 3.12, so allowing it makes
    # uv resolve a split (2.4.x on 3.11, 2.5.x on 3.12+) and its stubs then use
    # PEP 695 `type` statements that mypy rejects under python_version = "3.11".
    # Lift the cap together with requires-python if 3.11 support is dropped.
    "numpy>=1.26,<2.5",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "reedsolo>=1.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Imaging sidecar: a thin HTTP service the Go gateway calls for encode/decode.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
noir = "noircode.cli:app"
noir-api = "noircode.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noircode"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "reedsolo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
