# JSON access log, so the log pipeline (infra: Alloy -> Loki) parses fields
# instead of a combined-format line. Docker health probes (wget from inside the
# container) are not logged: they were nearly every line this container wrote.
log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"referer":"$http_referer","user_agent":"$http_user_agent",'
    '"request_time":$request_time}';
map "$remote_addr $http_user_agent" $loggable {
    default         1;
    "127.0.0.1 Wget" 0;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log json if=$loggable;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version on error pages; redirects stay relative so they never
    # point at http:// behind the TLS-terminating proxy.
    server_tokens off;
    absolute_redirect off;

    # Phone photos of a panel run several MB; match the backend's body limit so
    # decode uploads aren't rejected with 413.
    client_max_body_size 20m;

    # API requests go to the backend container on the shared network. The full
    # /api/v1/... path is preserved (proxy_pass has no path component), matching
    # the backend's PATH_PREFIX.
    # Prometheus metrics are for an internal scraper, not the internet. Regex,
    # case-insensitive and slash-tolerant, because the backend's router matches
    # /api/v1/METRICS and /api/v1/metrics/ too.
    location ~* ^/api/v1/+metrics/*$ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files only, no SPA fallback: the app has no client-side routes,
    # and the fallback answered every unknown path with the landing page and a
    # 200, which search engines read as endless duplicates of it. A page is a
    # file (/about -> about.html); anything else is a real 404.
    # Directories are not pages: no $uri/ here, so /ru is a 404 rather than a
    # redirect to a 403. The root is the one exception, served by index.
    location = / {
    }
    location / {
        try_files $uri $uri.html =404;
    }
    error_page 404 /404.html;
}
