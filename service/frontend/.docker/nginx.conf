server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phone photos of a panel run several MB; match the backend's body limit so
    # decode uploads aren't rejected with 413.
    client_max_body_size 20m;

    # API requests go to the backend container on the shared network. The full
    # /api/v1/... path is preserved (proxy_pass has no path component), matching
    # the backend's PATH_PREFIX.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files only, no SPA fallback: the app has no client-side routes,
    # and the fallback answered every unknown path with the landing page and a
    # 200, which search engines read as endless duplicates of it. A page is a
    # file (/about -> about.html); anything else is a real 404.
    # Directories are not pages: no $uri/ here, so /ru is a 404 rather than a
    # redirect to a 403. The root is the one exception, served by index.
    location = / {
    }
    location / {
        try_files $uri $uri.html =404;
    }
    error_page 404 /404.html;
}
