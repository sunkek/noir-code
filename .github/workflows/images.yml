name: build-images

# Build the three service images and push them to GHCR. Packages inherit the
# repo's visibility — make them public (or add an imagePullSecret in k3s) so the
# cluster can pull. Images: ghcr.io/<owner>/noircode-{imaging,backend,frontend}.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: imaging
            context: service/python
            dockerfile: service/python/.docker/Dockerfile
          - component: backend
            context: service/backend
            dockerfile: service/backend/.docker/Dockerfile.prod
          - component: frontend
            context: service/frontend
            dockerfile: service/frontend/.docker/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-${{ matrix.component }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deploy: pin each Deployment to the freshly-built SHA and roll out.
  # Requires repo secret KUBECONFIG_B64 = base64 of a kubeconfig whose current
  # context targets the cluster (namespace noircode). Runs on main only.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-noircode # never overlap two rollouts
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Roll out new images
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 secret not set — skipping deploy."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for c in imaging backend frontend; do
            kubectl -n noircode set image "deployment/$c" \
              "$c=ghcr.io/$owner/noircode-$c:${GITHUB_SHA}"
          done
          kubectl -n noircode rollout status \
            deployment/imaging deployment/backend deployment/frontend --timeout=180s
