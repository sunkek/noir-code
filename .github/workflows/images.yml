name: build-images

# Build the three service images and push them to GHCR. Packages inherit the
# repo's visibility — make them public (or add an imagePullSecret in k3s) so the
# cluster can pull. Images: ghcr.io/<owner>/noircode-{imaging,backend,frontend}.
#
# Path-filtered: each component's build only runs when its source tree (or this
# workflow) changed. A tag push or manual dispatch forces all three to rebuild,
# so release artifacts and ad-hoc reruns always carry a fresh image per service.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      imaging: ${{ steps.filter.outputs.imaging }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            imaging:
              - 'service/python/**'
              - '.github/workflows/images.yml'
            backend:
              - 'service/backend/**'
              - '.github/workflows/images.yml'
            frontend:
              - 'service/frontend/**'
              - '.github/workflows/images.yml'

  build-imaging:
    needs: changes
    if: needs.changes.outputs.imaging == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: service/python
          file: service/python/.docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-imaging:latest
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-imaging:${{ github.sha }}
          cache-from: type=gha,scope=imaging
          cache-to: type=gha,mode=max,scope=imaging

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: service/backend
          file: service/backend/.docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: service/frontend
          file: service/frontend/.docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/noircode-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Continuous deploy: pin each Deployment to the freshly-built SHA and roll out,
  # but only for services that were actually rebuilt this run. Requires repo
  # secret KUBECONFIG_B64 = base64 of a kubeconfig whose current context targets
  # the cluster (namespace noircode). Runs on main only. ``if: always()`` lets
  # the deploy proceed even when some build jobs were skipped (no changes for
  # that service); failed builds still block via the per-service guards below.
  deploy:
    needs: [changes, build-imaging, build-backend, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-imaging.result != 'failure' &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    concurrency: deploy-noircode # never overlap two rollouts
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      IMAGING_CHANGED: ${{ needs.changes.outputs.imaging }}
      BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
      FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Roll out changed images
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 secret not set — skipping deploy."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          owner=${GITHUB_REPOSITORY_OWNER,,}
          to_roll=()
          roll() {
            local svc=$1
            kubectl -n noircode set image "deployment/$svc" \
              "$svc=ghcr.io/$owner/noircode-$svc:${GITHUB_SHA}"
            to_roll+=("deployment/$svc")
          }
          if [ "$IMAGING_CHANGED" = "true" ] || [ "$FORCE_ALL" = "true" ]; then roll imaging; fi
          if [ "$BACKEND_CHANGED" = "true" ] || [ "$FORCE_ALL" = "true" ]; then roll backend; fi
          if [ "$FRONTEND_CHANGED" = "true" ] || [ "$FORCE_ALL" = "true" ]; then roll frontend; fi
          if [ ${#to_roll[@]} -eq 0 ]; then
            echo "No services changed; nothing to roll out."
            exit 0
          fi
          kubectl -n noircode rollout status "${to_roll[@]}" --timeout=180s
