name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (core + sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --extra api
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  backend:
    name: backend (Go gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: service/backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "gofmt needs to run on:"; gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: frontend (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
