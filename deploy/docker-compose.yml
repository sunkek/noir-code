# NoiR Code — minimal stateless stack: a React SPA (nginx) → Go gateway →
# Python imaging sidecar. No database/broker/cache (encode/decode is stateless).
#
#   cd deploy && docker compose up --build
#   open http://localhost:8080
#
# Only the frontend is published; it proxies /api to the backend on the internal
# network, which in turn calls the imaging sidecar.
services:
  imaging:
    build:
      context: ../service/python
      dockerfile: .docker/Dockerfile
      # Build over the host network so RUN steps (pip/go/npm) use the host's
      # working DNS resolver instead of Docker's embedded one.
      network: host
    container_name: noircode_imaging
    restart: unless-stopped
    expose:
      - 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../service/backend
      dockerfile: .docker/Dockerfile.prod
      network: host
    container_name: noircode_backend
    restart: unless-stopped
    depends_on:
      imaging:
        condition: service_healthy
    environment:
      NOIRCODE_API_FIBER_HOST: "0.0.0.0"
      NOIRCODE_API_FIBER_PORT: "8000"
      NOIRCODE_API_HEALTH_PORT: "3333"
      NOIRCODE_API_IMAGING_BASE_URL: "http://imaging:8001"
      # Swagger UI at /api/v1/docs (spec generated by swag v2 into ./docs,
      # copied to /docs in the image).
      NOIRCODE_API_FIBER_SWAGGER_FILE_PATH: "/docs/swagger.json"
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ../service/frontend
      dockerfile: .docker/Dockerfile.prod
      network: host
    container_name: noircode_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
